# MySQL profile.  Run:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# The login comes from environment variables (nothing secret is stored in the code):
#   DB_USER and DB_PASSWORD are required.  DB_URL is optional.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskmanager?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
