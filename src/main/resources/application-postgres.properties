# PostgreSQL profile.  Run:  mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# Create the database first:  createdb taskmanager
# The login comes from environment variables (nothing secret is stored in the code):
#   DB_USER and DB_PASSWORD are required.  DB_URL is optional.
# Either set DB_URL, or set DB_HOST / DB_PORT / DB_NAME (used by render.yaml).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskmanager}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
