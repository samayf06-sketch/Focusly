# ---- Smart Task & Deadline Manager ----
#
# DEFAULT DATABASE: a file-based H2 database stored in the ./data folder.
# Nothing to install, and your accounts and tasks are kept when you stop the app.
#
# Want a "real" database server instead?  Run with a profile:
#   mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# For a throw-away demo (in-memory, wiped on every stop):
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev

server.port=${PORT:8080}
# Behind a host's https proxy (Render, Railway...) and smaller downloads
server.forward-headers-strategy=framework
server.compression.enabled=true
server.error.include-message=never

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/taskmanager}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Creates/updates the tables automatically. See database/schema_*.sql for the manual version.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.serialization.write-dates-as-timestamps=false

# ---- SECRETS ----
# No passwords or keys are written in this project. Anything secret is read from an
# environment variable (see .env.example): DB_USER and DB_PASSWORD.

